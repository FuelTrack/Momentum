<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171512"><title>Momentum — Your daily progress</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;--accent:#ed8956;--bg:#171512;--surface:#211e1b;--surface2:#2b2622;--text:#faf7f2;--muted:#a99e94;--border:#3b342e;--shadow:0 18px 55px #0002;color-scheme:dark}body.light{--bg:#faf7f2;--surface:#fff;--surface2:#f4eee7;--text:#241e19;--muted:#796d63;--border:#e9ded4;--shadow:0 18px 55px #4d332010;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);transition:background .25s,color .25s}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{max-width:760px;margin:auto;min-height:100vh;padding:25px 18px 118px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:850;letter-spacing:-.7px}.mark{display:grid;place-items:center;background:var(--accent);color:#24180f;width:36px;height:36px;border-radius:12px;font-weight:900}.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);width:42px;height:42px;border-radius:15px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(32px,7vw,48px);line-height:1.07;letter-spacing:-1.8px;margin:12px 0}.muted{color:var(--muted)}.hero{margin-bottom:26px}.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:21px;box-shadow:var(--shadow);margin:14px 0}.highlight{background:linear-gradient(135deg,var(--surface),var(--surface2));position:relative;overflow:hidden}.highlight:after{content:"";position:absolute;right:-70px;top:-85px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#ed89562a,transparent 70%);pointer-events:none}.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.section h2{font-size:20px;letter-spacing:-.5px;margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0}.number{font-size:30px;font-weight:850;letter-spacing:-1px}.tiny{font-size:12px}.progress{height:8px;background:var(--surface2);border-radius:100px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--accent);border-radius:100px;transition:width .3s}.btn{border:0;border-radius:13px;background:var(--accent);color:#28180f;padding:12px 16px;font-weight:800}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.small{padding:8px 11px;font-size:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{min-width:0;width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}form{display:grid;gap:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{padding:14px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}.chip{font-size:11px;padding:6px 9px;border-radius:30px;background:var(--surface2);color:var(--muted)}.nav{position:fixed;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),680px);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);border-radius:23px;padding:7px;box-shadow:0 12px 45px #0004;backdrop-filter:blur(20px)}.nav button{display:grid;place-items:center;gap:5px;padding:10px 1px;border:0;background:transparent;color:var(--muted);border-radius:16px;font-size:10px}.nav button.active{background:var(--surface2);color:var(--accent);font-weight:800}.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.page{animation:rise .28s ease both}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.empty{padding:22px;text-align:center;color:var(--muted)}.chart{display:flex;align-items:end;gap:7px;height:150px;margin-top:16px}.barcol{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{border-radius:7px 7px 3px 3px;background:var(--accent);min-height:3px;margin-bottom:7px}.notice{padding:12px;border-radius:13px;background:var(--surface2);color:var(--muted);font-size:12px}.linklike{border:0;background:none;color:var(--accent);font-weight:750}.hidden{display:none!important}@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.card{padding:16px}.nav button{font-size:9px}.number{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">M</span>momentum<span style="color:var(--accent)">.</span></div><button class="iconbtn" id="theme" aria-label="Toggle light and dark mode">☼</button></header><main id="view"></main></div><nav class="nav" id="nav" aria-label="Main navigation"></nav><script>
'use strict';
const KEY='momentum.v2',OLD=['momentum.v1','momentum-data','momentumData'];
const today=()=>new Date().toLocaleDateString('en-CA');
const defaults=()=>({version:2,theme:'dark',calorieTarget:2200,proteinTarget:120,waterTarget:2500,foods:[],habits:[{id:'h1',name:'Drink water',goal:1},{id:'h2',name:'Go for a walk',goal:1}],habitLogs:{},exercises:[{id:'e1',name:'Push-ups',goal:50,unit:'reps'},{id:'e2',name:'Steps',goal:8000,unit:'steps'}],exerciseLogs:{},waterLogs:{},weightLogs:[],notes:[],created:today()});
const safeArray=x=>Array.isArray(x)?x:[];
function normalise(x){const d=defaults();if(!x||typeof x!=='object'||Array.isArray(x))return d;return {...d,...x,version:2,foods:safeArray(x.foods),habits:safeArray(x.habits),exercises:safeArray(x.exercises),weightLogs:safeArray(x.weightLogs),notes:safeArray(x.notes),habitLogs:x.habitLogs&&typeof x.habitLogs==='object'?x.habitLogs:{},exerciseLogs:x.exerciseLogs&&typeof x.exerciseLogs==='object'?x.exerciseLogs:{},waterLogs:x.waterLogs&&typeof x.waterLogs==='object'?x.waterLogs:{}}}
function load(){try{let s=localStorage.getItem(KEY);if(s)return normalise(JSON.parse(s));for(const k of OLD){s=localStorage.getItem(k);if(s){const old=JSON.parse(s);return normalise(old)}}}catch(e){console.warn('Stored data could not be parsed',e)}return defaults()}
let db=load(),page='home',chartDays=7;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Check browser storage settings or export your data.')}}function change(fn){fn();save();render()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const num=(v,min=0,max=1000000)=>Math.min(max,Math.max(min,Number(v)||0));
const fmt=v=>Math.round(num(v)).toLocaleString();
const sum=(xs,key)=>xs.reduce((a,x)=>a+num(x[key]),0);
const foodsOn=d=>db.foods.filter(x=>x.date===d);
const calories=d=>sum(foodsOn(d),'calories');
const protein=d=>sum(foodsOn(d),'protein');
const water=d=>num(db.waterLogs[d]||0);
const habitCount=d=>db.habits.filter(h=>!!db.habitLogs[d+'|'+h.id]).length;
const exerciseDone=(d,e)=>num(db.exerciseLogs[d+'|'+e.id]||0);
const percent=(a,b)=>Math.min(100,Math.round(a/Math.max(1,b)*100));
const progress=(a,b)=>'<div class="progress"><div style="width:'+percent(a,b)+'%"></div></div>';
const btn=(label,action,secondary=false)=>'<button class="btn'+(secondary?' secondary':'')+'" data-action="'+action+'">'+label+'</button>';
const section=(title,sub='')=>'<div class="section"><h2>'+title+'</h2><span class="tiny muted">'+sub+'</span></div>';
const heading=(k,title,sub)=>'<div class="hero"><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div>';
const card=(inner,cls='')=>'<div class="card '+cls+'">'+inner+'</div>';
const field=(label,name,type='number',value='',extra='')=>'<label class="field">'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+' required></label>';
function home(){const d=today(),c=calories(d),h=habitCount(d),ex=db.exercises.filter(e=>exerciseDone(d,e)>=num(e.goal)).length,score=Math.round((percent(h,db.habits.length)+percent(ex,db.exercises.length)+percent(water(d),db.waterTarget))/3);
return heading('YOUR PERSONAL SPACE','Welcome to Momentum.','Small steps. Stronger every day.')+card('<div class="row"><div><div class="eyebrow">DAILY MOMENTUM</div><h2 style="font-size:28px;letter-spacing:-1px;margin:10px 0">You’re building consistency.</h2><div class="muted tiny">Today · '+esc(d)+'</div></div><div style="font-size:38px;font-weight:850;color:var(--accent)">'+score+'%</div></div>'+progress(score,100)+'<div class="tiny muted">Based on habits, exercise goals and hydration. Rest and recovery count too.</div>','highlight')+section('Today at a glance')+'<div class="grid">'+card('<div class="tiny muted">Calories logged</div><div class="number">'+fmt(c)+'</div><div class="tiny muted">of '+fmt(db.calorieTarget)+' kcal</div>'+progress(c,db.calorieTarget))+card('<div class="tiny muted">Habits completed</div><div class="number">'+h+' / '+db.habits.length+'</div><div class="tiny muted">Keep showing up</div>'+progress(h,db.habits.length))+card('<div class="tiny muted">Exercise goals</div><div class="number">'+ex+' / '+db.exercises.length+'</div><div class="tiny muted">Completed today</div>')+card('<div class="tiny muted">Water</div><div class="number">'+(water(d)/1000).toFixed(1)+' L</div><div class="tiny muted">of '+(db.waterTarget/1000).toFixed(1)+' L</div>'+progress(water(d),db.waterTarget))+'</div>'+section('Quick actions')+card('<div class="row" style="flex-wrap:wrap">'+btn('+ Log a meal','go:calories')+btn('+ Complete a habit','go:habits',true)+btn('+ Log exercise','go:exercise',true)+'</div>')+section('Your data')+card('<div class="row"><div><b>Private by design</b><div class="tiny muted">Stored on this device, in this browser.</div></div>'+btn('Settings & backup','settings',true)+'</div>')}
function caloriePage(){const d=today(),items=foodsOn(d),c=calories(d);return heading('NUTRITION','Calories & nutrition.','Log meals and monitor your intake without judgement.')+card('<div class="row"><div><div class="eyebrow">TODAY’S INTAKE</div><div class="number">'+fmt(c)+' <span class="tiny muted">kcal</span></div></div><div class="tiny muted">'+fmt(db.calorieTarget)+' kcal reference</div></div>'+progress(c,db.calorieTarget)+'<div class="row"><span class="muted tiny">Protein: '+fmt(protein(d))+' / '+fmt(db.proteinTarget)+' g</span><button class="linklike" data-action="settings">Edit targets</button></div>','highlight')+section('Add a food')+card('<form data-form="food">'+field('Food / meal','name','text','', 'maxlength="90"')+'<div class="formgrid">'+field('Calories (kcal)','calories','number','', 'min="0" step="1"')+field('Protein (g)','protein','number',0,'min="0" step="0.1"')+field('Carbs (g)','carbs','number',0,'min="0" step="0.1"')+field('Fat (g)','fat','number',0,'min="0" step="0.1"')+'</div><button class="btn" type="submit">Save food</button></form>')+section('Today’s food',items.length+' entries')+card(items.length?items.slice().reverse().map(x=>'<div class="item row"><div><b>'+esc(x.name)+'</b><div class="tiny muted">'+fmt(x.calories)+' kcal · P '+fmt(x.protein)+'g · C '+fmt(x.carbs)+'g · F '+fmt(x.fat)+'g</div></div><button class="btn small secondary" data-action="deletefood:'+esc(x.id)+'" aria-label="Remove '+esc(x.name)+'">Remove</button></div>').join(''):'<div class="empty">No foods logged yet. Start with your next meal.</div>')}
function habitsPage(){const d=today();return heading('CONSISTENCY','Daily habits.','Your routine, your pace, one day at a time.')+card('<div class="row"><div><div class="eyebrow">TODAY’S CHECK-IN</div><div class="number">'+habitCount(d)+' / '+db.habits.length+'</div></div><div class="tiny muted">habits completed</div></div>'+progress(habitCount(d),db.habits.length),'highlight')+section('Your habits')+card(db.habits.length?db.habits.map(h=>'<div class="item row"><div><b>'+esc(h.name)+'</b><div class="tiny muted">'+(db.habitLogs[d+'|'+h.id]?'Completed today':'Ready when you are')+'</div></div><div class="row"><button class="btn small '+(db.habitLogs[d+'|'+h.id]?'':'secondary')+'" data-action="habit:'+esc(h.id)+'">'+(db.habitLogs[d+'|'+h.id]?'✓ Done':'Mark done')+'</button><button class="linklike" data-action="deletehabit:'+esc(h.id)+'" aria-label="Delete habit">×</button></div></div>').join(''):'<div class="empty">Add a habit to begin.</div>')+section('Build a new habit')+card('<form data-form="habit">'+field('Habit name','name','text','','maxlength="80"')+'<button class="btn">Add habit</button></form>')+section('Hydration')+card('<div class="row"><div><div class="number">'+(water(d)/1000).toFixed(2)+' L</div><div class="tiny muted">Daily reference '+(db.waterTarget/1000).toFixed(2)+' L</div></div>'+btn('+ 250 ml','water:250')+'</div>'+progress(water(d),db.waterTarget)+'<button class="linklike" data-action="water:-250">Undo 250 ml</button>')}
function exercisePage(){const d=today();return heading('MOVEMENT','Exercise goals.','Celebrate every rep, walk and personal best.')+section('Your goals',db.exercises.length+' active')+db.exercises.map(e=>card('<div class="row"><div><b>'+esc(e.name)+'</b><div class="tiny muted">'+fmt(exerciseDone(d,e))+' / '+fmt(e.goal)+' '+esc(e.unit)+'</div></div><span class="chip">'+percent(exerciseDone(d,e),e.goal)+'%</span></div>'+progress(exerciseDone(d,e),e.goal)+'<form data-form="exercise" data-id="'+esc(e.id)+'"><div class="row"><label class="field" style="flex:1">Add '+esc(e.unit)+'<input name="amount" type="number" min="1" max="100000" step="1" value="'+(e.unit==='steps'?1000:10)+'" required></label><button class="btn" type="submit">Log set</button><button class="btn secondary small" type="button" data-action="deleteexercise:'+esc(e.id)+'">Delete</button></div></form>')).join('')+section('Create an exercise goal')+card('<form data-form="newexercise">'+field('Exercise name','name','text','','maxlength="80"')+'<div class="formgrid">'+field('Daily goal','goal','number',50,'min="1" step="1"')+'<label class="field">Unit<select name="unit"><option value="reps">reps</option><option value="steps">steps</option><option value="minutes">minutes</option><option value="seconds">seconds</option></select></label></div><button class="btn">Add goal</button></form>')}
function dates(n){return Array.from({length:n},(_,i)=>{const x=new Date();x.setDate(x.getDate()-(n-1-i));return x.toLocaleDateString('en-CA')})}
function progressPage(){const ds=dates(chartDays),max=Math.max(1,...ds.map(calories)),latest=db.weightLogs.slice().sort((a,b)=>b.date.localeCompare(a.date));return heading('YOUR JOURNEY','Progress history.','See how far you have come, beyond the number on a scale.')+section('Nutrition trends')+card('<div class="row"><b>Calories logged</b><div>'+btn('7 days','days:7',chartDays!==7)+ ' '+btn('14 days','days:14',chartDays!==14)+'</div></div><div class="chart">'+ds.map(d=>'<div class="barcol"><div class="bar" style="height:'+Math.max(3,Math.round(calories(d)/max*120))+'px"></div>'+esc(d.slice(8))+'</div>').join('')+'</div><div class="tiny muted">Daily totals from your logged meals; empty days indicate no entries.</div>')+section('Consistency')+card('<div class="row"><div><div class="tiny muted">Habits completed (last 7 days)</div><div class="number">'+dates(7).reduce((a,d)=>a+habitCount(d),0)+'</div></div><div><div class="tiny muted">Exercise goals met (last 7 days)</div><div class="number">'+dates(7).reduce((a,d)=>a+db.exercises.filter(e=>exerciseDone(d,e)>=num(e.goal)).length,0)+'</div></div></div>')+section('Optional weight history')+card('<form data-form="weight"><div class="formgrid">'+field('Date','date','date',today())+field('Weight (kg)','weight','number','','min="1" max="500" step="0.1"')+'</div><button class="btn">Save weight</button></form>'+(latest.length?latest.slice(0,10).map(x=>'<div class="item row"><span>'+esc(x.date)+'</span><b>'+num(x.weight).toFixed(1)+' kg</b><button class="linklike" data-action="deleteweight:'+esc(x.id)+'">Remove</button></div>').join(''):'<div class="empty">Weight tracking is optional.</div>'))+section('Reflection journal')+card('<form data-form="note"><label class="field">What went well today?<input name="note" maxlength="240" placeholder="A small win, energy level, or reflection" required></label><button class="btn">Save reflection</button></form>'+db.notes.slice(-8).reverse().map(x=>'<div class="item"><div class="tiny muted">'+esc(x.date)+'</div>'+esc(x.text)+'</div>').join(''))}
function settingsPage(){return heading('PREFERENCES','Settings & privacy.','Make Momentum work for you.')+card('<form data-form="settings"><div class="formgrid">'+field('Calorie reference','calorieTarget','number',db.calorieTarget,'min="1" max="20000"')+field('Protein reference (g)','proteinTarget','number',db.proteinTarget,'min="1" max="1000"')+field('Water reference (ml)','waterTarget','number',db.waterTarget,'min="1" max="10000"')+'</div><button class="btn">Save targets</button></form>')+section('Your data stays yours')+card('<p class="muted tiny">Records are stored only in this browser’s local storage. GitHub Pages serves the app but does not receive your logs. Clearing browser data or switching devices may erase local records; export backups regularly.</p><div class="row" style="flex-wrap:wrap">'+btn('Export JSON backup','export')+'<label class="btn secondary" style="cursor:pointer">Import JSON backup<input id="import" type="file" accept="application/json,.json" class="hidden"></label></div><p class="tiny muted">Import replaces all current Momentum records after confirmation.</p><button class="btn secondary" data-action="reset">Erase all local data</button></div>')+card('<b>About Momentum 2.0</b><p class="muted tiny">Designed for sustainable habits and personal reflection. Calorie and exercise targets are editable references, not medical advice. Avoid aggressive restriction and speak with your clinician about changes after medication.</p>')}
const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',calories:'<path d="M5 3v8m4-8v8M5 7h4m-2 4v10M16 3v18m0-18c6 3 6 9 0 10"/>',habits:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="m7 12 3 3 7-7"/>',exercise:'<path d="M3 9v6m4-9v12m10-12v12m4-9v6M7 12h10"/>',progress:'<path d="M3 20V4m0 16h18M7 16l4-5 4 2 5-8"/>'};
const tabs=[['home','Home'],['calories','Calories'],['habits','Habits'],['exercise','Exercise'],['progress','Progress']];
function render(){document.body.classList.toggle('light',db.theme==='light');document.getElementById('theme').textContent=db.theme==='light'?'☾':'☼';document.getElementById('nav').innerHTML=tabs.map(([k,n])=>'<button data-action="go:'+k+'" class="'+(page===k?'active':'')+'" '+(page===k?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>'+n+'</button>').join('');document.getElementById('view').innerHTML='<div class="page">'+({home,calories:caloriePage,habits:habitsPage,exercise:exercisePage,progress:progressPage,settings:settingsPage}[page]||home)()+'</div>'}
document.getElementById('theme').onclick=()=>change(()=>db.theme=db.theme==='dark'?'light':'dark');
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [a,v]=b.dataset.action.split(':');if(a==='go'){page=v;render();window.scrollTo(0,0)}else if(a==='settings'){page='settings';render();window.scrollTo(0,0)}else if(a==='habit')change(()=>{const k=today()+'|'+v;db.habitLogs[k]=!db.habitLogs[k]});else if(a==='water')change(()=>db.waterLogs[today()]=num(water(today())+Number(v)));else if(a==='days'){chartDays=Number(v);render()}else if(a==='deletefood'&&confirm('Remove this food?'))change(()=>db.foods=db.foods.filter(x=>x.id!==v));else if(a==='deletehabit'&&confirm('Delete this habit?'))change(()=>db.habits=db.habits.filter(x=>x.id!==v));else if(a==='deleteexercise'&&confirm('Delete this exercise goal?'))change(()=>db.exercises=db.exercises.filter(x=>x.id!==v));else if(a==='deleteweight'&&confirm('Remove this weight entry?'))change(()=>db.weightLogs=db.weightLogs.filter(x=>x.id!==v));else if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='momentum-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='reset'&&confirm('Permanently erase ALL Momentum data on this browser? Export a backup first.')){db=defaults();save();page='home';render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const x=Object.fromEntries(new FormData(f));switch(f.dataset.form){case 'food':change(()=>db.foods.push({id:id(),date:today(),name:String(x.name).trim().slice(0,90),calories:num(x.calories),protein:num(x.protein),carbs:num(x.carbs),fat:num(x.fat)}));break;case 'habit':if(!String(x.name).trim())return;change(()=>db.habits.push({id:id(),name:String(x.name).trim().slice(0,80),goal:1}));break;case 'exercise':change(()=>{const k=today()+'|'+f.dataset.id;db.exerciseLogs[k]=num(num(db.exerciseLogs[k])+num(x.amount))});break;case 'newexercise':if(!String(x.name).trim())return;change(()=>db.exercises.push({id:id(),name:String(x.name).trim().slice(0,80),goal:num(x.goal,1),unit:['reps','steps','minutes','seconds'].includes(x.unit)?x.unit:'reps'}));break;case 'weight':change(()=>db.weightLogs.push({id:id(),date:x.date,weight:num(x.weight,1,500)}));break;case 'note':if(!String(x.note).trim())return;change(()=>db.notes.push({id:id(),date:today(),text:String(x.note).trim().slice(0,240)}));break;case 'settings':change(()=>{db.calorieTarget=num(x.calorieTarget,1,20000);db.proteinTarget=num(x.proteinTarget,1,1000);db.waterTarget=num(x.waterTarget,1,10000)});break;}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('File exceeds 5 MB');const raw=JSON.parse(await file.text());if(!raw||typeof raw!=='object'||Array.isArray(raw)||!Array.isArray(raw.foods)||!Array.isArray(raw.habits)||!Array.isArray(raw.exercises))throw Error('Invalid Momentum backup structure');if(!confirm('Replace all current Momentum records with this backup?'))return;db=normalise(raw);save();page='home';render();alert('Backup imported successfully')}catch(err){alert('Import failed: '+err.message)}});
render();
</script></body></html>
